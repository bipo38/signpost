name: pages
on:
  push:
    branches: [master]
    paths: ['site/**', 'src/**', 'shared/**', 'index.html', 'vite.config.ts', 'package.json', 'pnpm-lock.yaml', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The app lives under /signpost/app/ on Pages; the landing page stays a plain file in site/.
      - run: pnpm build --base=/signpost/app/
      - run: cp -r dist site/app
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
