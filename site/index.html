<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>signpost — a graph of the docs behind your CLAUDE.md or AGENTS.md</title>
<meta name="description" content="Visualize the context-pointer docs behind a CLAUDE.md / AGENTS.md file as a graph, and add new docs already wired into it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ---- tokens (src/assets/main.css) ---- */
:root {
  --radius: 0.625rem;
  --background: oklch(0.9848 0 0);
  --foreground: oklch(0.129 0.042 264.695);
  --card: oklch(1 0 0);
  --primary: oklch(0.5498 0.1683 34.74);
  --primary-foreground: oklch(0.985 0.005 34.74);
  --muted: oklch(0.968 0.007 247.896);
  --muted-foreground: oklch(0.554 0.046 257.417);
  --border: oklch(0.929 0.013 255.508);
  --accent-orange: oklch(0.6776 0.1913 34.74);
  --accent-success: oklch(0.6371 0.1749 146.7);
  --destructive: oklch(0.577 0.245 27.325);
  --dot: rgba(22,22,23,.15);
  --font-geist: 'Geist','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-display: 'Instrument Serif',ui-serif,Georgia,serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--background); color: var(--foreground);
  font-family: var(--font-geist); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; font-feature-settings: 'kern' 1,'liga' 1,'calt' 1,'ss01' 1;
}
a { color: inherit; }
code, pre, kbd { font-family: var(--font-mono); }
button { font: inherit; color: inherit; cursor: pointer; }


.brand { font-family: var(--font-display); font-size: 22px; line-height: 1; letter-spacing: -0.01em; }
.copy {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 6px; background: var(--card);
  font-size: 12px; color: var(--muted-foreground); transition: color 150ms ease-out, border-color 150ms ease-out, transform 120ms ease-out;
}
.copy:hover { color: var(--foreground); border-color: var(--muted-foreground); }
.copy:active { transform: scale(0.97); }
.copy[data-done] { color: var(--accent-success); border-color: var(--accent-success); }
.cmd {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
  font-family: var(--font-mono); font-size: 13.5px; overflow-x: auto;
}
.cmd .p { color: var(--muted-foreground); user-select: none; margin-right: 8px; }
.cmd .hl { color: var(--primary); }
.dim { color: var(--muted-foreground); }
.btn {
  display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; border: 0;
  background: var(--primary); color: var(--primary-foreground); font-size: 13.5px; font-weight: 500; text-decoration: none;
  transition: filter 150ms ease-out, transform 120ms ease-out;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(0.98); }
.btn.ghost { background: transparent; color: var(--foreground); border: 1px solid var(--border); }
.btn.ghost:hover { filter: none; border-color: var(--muted-foreground); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted-foreground); font-weight: 500; font-size: 12.5px; }
td code { font-size: 12.5px; background: var(--muted); padding: 1px 5px; border-radius: 4px; }
.footer { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted-foreground); }
.footer a { text-underline-offset: 3px; }

/* ================= V3 LIVE GRAPH ================= */
.v3 { display: flex; flex-direction: column; min-height: 100vh; }
.v3 header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 56px; padding: 10px 24px; border-bottom: 1px solid var(--border); background: var(--card); }
.v3 header .meta { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--muted-foreground); }
.v3 header .meta .stat { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v3 header .meta b { font-weight: 500; color: var(--foreground); }
.v3 header nav { margin-left: auto; display: flex; gap: 14px; font-size: 13px; color: var(--muted-foreground); align-items: center; }
.v3 header nav a { text-decoration: none; }
.v3 header nav a:not(.btn):hover { color: var(--foreground); }
.v3 .canvasrow { display: grid; grid-template-columns: 1fr 380px; flex: 1; min-height: 560px; }
.v3 .canvas {
  position: relative; overflow: hidden;
  background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 20px 20px; background-position: 10px 10px;
}
.v3 .plot { position: absolute; inset: 0; margin: auto; aspect-ratio: 880 / 470; max-width: 100%; max-height: 100%; }
.v3 .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.v3 .edge { fill: none; stroke: var(--muted-foreground); stroke-opacity: .45; stroke-width: 1.25; transition: stroke-opacity 150ms ease-out, stroke 150ms ease-out; }
.v3 .edge.draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 700ms var(--ease-out) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.v3 .canvas[data-hover] .edge { stroke-opacity: .1; }
.v3 .canvas[data-hover] .edge.lit { stroke: var(--accent-orange); stroke-opacity: .95; }
.v3 .elabel { font-family: var(--font-geist); font-size: 10px; fill: var(--muted-foreground); }
.v3 .node {
  position: absolute; width: 17.05%; padding: 8px 10px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--card);
  font-size: 11.5px; line-height: 1.3; cursor: pointer; text-align: left;
  transition: border-color 150ms ease-out, box-shadow 150ms ease-out, transform 150ms var(--ease-out);
  animation: pop 320ms var(--ease-out) both;
}
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.v3 .node:hover { border-color: var(--muted-foreground); }
.v3 .node.selected { border-color: var(--accent-orange); }
.v3 .node .corner { position: absolute; width: 5px; height: 5px; border-radius: 999px; background: var(--dot); transition: background 160ms ease-out; }
.v3 .node.selected .corner { background: var(--accent-orange); }
.corner-tl { top: -3px; left: -3px; } .corner-tr { top: -3px; right: -3px; } .corner-bl { bottom: -3px; left: -3px; } .corner-br { bottom: -3px; right: -3px; }
.v3 .node .name { font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.v3 .node .tag { font-size: 8.5px; font-weight: 600; letter-spacing: .06em; padding: 2px 5px; border-radius: 999px; background: var(--foreground); color: var(--background); }
.v3 .node .sub { display: flex; justify-content: space-between; color: var(--muted-foreground); font-size: 10px; margin-top: 3px; }
.v3 .node .sub .io { display: flex; gap: 5px; }
.v3 .node .sub .in { color: var(--accent-success); } .v3 .node .sub .out { color: var(--primary); }
.v3 .panel { border-left: 1px solid var(--border); background: var(--card); padding: 28px 28px 32px; display: flex; flex-direction: column; }
.v3 .panel .path { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); margin-bottom: 14px; display: flex; justify-content: space-between; }
.v3 .panel h2 { font-family: var(--font-display); font-size: 28px; font-weight: 400; margin: 0 0 14px; line-height: 1.1; }
.v3 .panel p { font-size: 13.5px; margin: 0 0 10px; }
.v3 .panel p code, .v3 .panel li code { font-size: 12px; background: var(--muted); padding: 1px 5px; border-radius: 4px; color: var(--primary); cursor: pointer; }
.v3 .panel ul { font-size: 13.5px; padding-left: 20px; margin: 0 0 10px; }
/* Broken links, mirrors the app panel */
.v3 .badge { flex-shrink: 0; padding: 1px 6px; border-radius: 4px; border: 1px solid color-mix(in oklch, var(--destructive) 40%, transparent); background: color-mix(in oklch, var(--destructive) 10%, transparent); color: var(--destructive); font-size: 11px; cursor: pointer; transition: background 150ms ease-out; }
.v3 .badge:hover { background: color-mix(in oklch, var(--destructive) 20%, transparent); }
.v3 .panel .intro { font-size: 12.5px; color: var(--muted-foreground); margin: 0 0 16px; }
.v3 .bl { border: 1px solid var(--border); border-radius: 6px; background: var(--card); padding: 10px 12px; font-size: 12.5px; margin-bottom: 12px; }
.v3 .bl .top { display: flex; justify-content: space-between; gap: 8px; }
.v3 .bl .top b { font-weight: 500; } .v3 .bl .top .ln { color: var(--muted-foreground); font-weight: 400; }
.v3 .bl .kind { font-size: 11px; color: var(--muted-foreground); }
.v3 .bl .diff { margin-top: 6px; border-radius: 4px; background: var(--muted); padding: 4px 8px; font-family: var(--font-mono); font-size: 11px; line-height: 20px; color: var(--muted-foreground); }
.v3 .bl .diff div { display: flex; gap: 6px; overflow: hidden; white-space: pre; }
.v3 .bl .diff div span:last-child { overflow: hidden; text-overflow: ellipsis; }
.v3 .bl .diff .m { color: var(--destructive); user-select: none; } .v3 .bl .diff .pl { color: var(--accent-success); user-select: none; }
.v3 .bl mark { border-radius: 2px; padding: 0 2px; }
.v3 .bl mark.del { background: color-mix(in oklch, var(--destructive) 15%, transparent); color: var(--destructive); text-decoration: line-through; }
.v3 .bl mark.add { background: color-mix(in oklch, var(--accent-success) 15%, transparent); color: var(--accent-success); }
.v3 .bl .gone { font-style: italic; }
.v3 .bl .act { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.v3 .bl select { flex: 1; min-width: 0; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: inherit; font: inherit; font-size: 11.5px; padding: 0 6px; }
.v3 .bl .b { height: 28px; padding: 0 10px; border-radius: 6px; border: 0; font-size: 11.5px; font-weight: 500; background: var(--primary); color: var(--primary-foreground); }
.v3 .bl .b.rm { background: transparent; border: 1px solid var(--border); color: var(--destructive); font-weight: 400; }
.v3 .bl .b.rm:hover { background: color-mix(in oklch, var(--destructive) 10%, transparent); }
.v3 .panel .empty { text-align: center; color: var(--muted-foreground); font-size: 13px; margin: auto 0; }
.v3 .panel .empty b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 400; color: var(--foreground); margin-bottom: 6px; }
/* LinkedDocs, ported from src/components/LinkedDocs.vue */
.v3 .linked { margin-bottom: 20px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); padding: 8px 8px 4px; }
.v3 .linked svg { display: block; width: 100%; overflow: visible; }
.v3 .linked .fan { animation: fan-in 260ms var(--ease-out) both; animation-delay: calc(var(--i) * 20ms); }
@keyframes fan-in { from { opacity: 0; } to { opacity: 1; } }
.v3 .linked circle[data-go] { cursor: pointer; }
.v3 .linked .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; padding: 4px 4px 0; font-size: 11px; line-height: 18px; }
.v3 .linked .legend .in { color: var(--accent-success); } .v3 .linked .legend .out { color: var(--accent-orange); }
.v3 .linked .legend .n { color: var(--muted-foreground); }
.v3 .linked .legend button { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; line-height: 22px; border: 0; background: none; padding: 0; color: var(--muted-foreground); transition: color 150ms ease-out; }
.v3 .linked .legend button:hover { color: var(--foreground); }
.v3 .linked .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; margin-right: 4px; vertical-align: middle; }
.v3 .linked .legend .x { margin-left: 4px; font-size: 10px; }
.v3 .below { max-width: 1040px; margin: 0 auto; padding: 72px 24px 140px; width: 100%; }
.v3 .below h1 { font-family: var(--font-display); font-size: clamp(28px, 4.1vw, 44px); font-weight: 400; line-height: 1.08; margin: 0 0 16px; letter-spacing: -0.01em; }
.v3 .below .lede { color: var(--muted-foreground); font-size: 16px; max-width: 60ch; margin: 0 0 28px; }
.v3 .below .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px; margin-top: 56px; }
.v3 .below h3 { font-size: 13px; text-transform: lowercase; letter-spacing: .02em; color: var(--muted-foreground); font-weight: 500; margin: 0 0 10px; }
.v3 .below .footer { margin-top: 80px; padding-top: 20px; border-top: 1px solid var(--border); }

@media (max-width: 900px) {
  .v3 .canvasrow { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .v3 .canvas, .v3 .panel { min-width: 0; }
  /* Right-edge fade says "there is more to the right" without a control. */
  .v3 .canvasrow { position: relative; }
  .v3 .canvasrow::after { content: ''; position: absolute; top: 0; right: 0; width: 48px; height: var(--plot-h, 440px); pointer-events: none; background: linear-gradient(to right, transparent, var(--background)); }
  /* The graph keeps a legible width and pans sideways, as the real canvas does. */
  .v3 .canvas { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .v3 .plot { position: relative; inset: auto; width: 760px; max-width: none; max-height: none; margin: 16px 0 24px; }
  .v3 .canvasrow { --plot-h: calc(760px * 470 / 880 + 40px); }
  .v3 .panel { border-left: 0; border-top: 1px solid var(--border); padding: 24px 16px 28px; min-height: 320px; scroll-margin-top: 8px; }
  .v3 .below { padding: 56px 16px calc(96px + env(safe-area-inset-bottom)); }
  .v3 .below h1 br { display: none; }
  .v3 .below .cols { gap: 28px; margin-top: 40px; }
  .v3 .below .lede, .v3 .below .cols p { font-size: 15px !important; }
}
@media (max-width: 640px) {
  /* Phone header: brand and the install action first, then the repo stats as a status row with the badge pinned right. */
  .v3 header { padding: 8px 16px 10px; gap: 6px 10px; }
  .v3 header nav { gap: 10px; }
  .v3 header .meta { order: 3; flex-basis: 100%; font-size: 12.5px; }
  .v3 header .meta .badge { margin-left: auto; }
}
@media (max-width: 480px) {
  .v3 header .meta .entry, .v3 .badge .w { display: none; }
  .v3 .plot { width: 640px; }
  .v3 .canvasrow { --plot-h: calc(640px * 470 / 880 + 40px); }
  .v3 .below h1 { font-size: 28px; }
}
/* Touch: bigger targets, no hover-only affordances. */
@media (pointer: coarse) {
  .v3 header nav a { padding: 8px 4px; }
  .v3 header nav .btn { height: 40px !important; padding: 0 14px; }
  .v3 .badge { padding: 6px 10px; font-size: 12px; }
  .copy { height: 40px; padding: 0 14px; font-size: 13px; }
  .v3 .bl .b, .v3 .bl select { height: 40px; }
  .v3 .bl .act { flex-wrap: wrap; } .v3 .bl select { flex-basis: 100%; }
  .v3 .linked .legend button { line-height: 30px; }
  .v3 .panel p code, .v3 .panel li code { padding: 4px 6px; }
}

@media (prefers-reduced-motion: reduce) {
  .v3 .node, .v3 .edge.draw, .v3 .linked .fan { animation: none !important; }
  .v3 .edge.draw { stroke-dashoffset: 0; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
const GH = 'https://github.com/bipo38/signpost';
const INSTALL = 'pnpm add -D @brotzi/signpost';
const NPX = 'npx @brotzi/signpost';

const copyBtn = (text, label = 'copy') =>
  `<button class="copy" data-copy="${text.replace(/"/g, '&quot;')}">${label}</button>`;

const footer = `<div class="footer">
  <span>MIT</span>
  <a href="${GH}">github</a>
  <a href="https://www.npmjs.com/package/@brotzi/signpost">npm</a>
</div>`;

/* ---------- V3 LIVE GRAPH ---------- */
const NODES = [
  { id: 'CLAUDE.md', dir: '/', x: 40,  y: 240, entry: true, title: 'Repo instructions',
    body: `<p>Read this first, then follow the pointer for your situation.</p>
    <table><tr><th>situation</th><th>open</th></tr>
    <tr><td>any change</td><td><code>docs/plan.md</code></td></tr>
    <tr><td>UI exploration</td><td><code>docs/prototype.md</code></td></tr></table>` },
  { id: 'plan.md', dir: 'docs', x: 260, y: 240, title: 'Develop flow',
    body: `<p>How to develop anything in this repo <b>except</b> prototype exploration (<code>docs/prototype.md</code>).</p>
    <ul><li>Always switch to plan mode first. Open <code>docs/plan-mode.md</code>, apply its rules, return here.</li>
    <li>Then apply the needed testing: <code>docs/testing/ui.md</code>, <code>docs/testing/be-internal.md</code>, <code>docs/testing/fe-internal.md</code>.</li></ul>` },
  { id: 'prototype.md', dir: 'docs', x: 260, y: 110, title: 'Prototype exploration',
    body: `<p>Divergent UI variants behind a picker. Check <code>PRODUCT.md</code> for tone before designing.</p><p>Plan first: <code>docs/plan-mode.md</code>.</p>` },
  { id: 'PRODUCT.md', dir: '/', x: 480, y: 40, title: 'Product',
    body: `<p>Who this is for, what it must never do, and the words we use in the UI.</p>` },
  { id: 'plan-mode.md', dir: 'docs', x: 480, y: 180, title: 'Plan mode',
    body: `<p>Rules for planning before touching code. When done, return to the caller.</p>
    <table><tr><th>Came from</th><th>Return to</th></tr><tr><td><code>docs/plan.md</code></td><td>the plan step</td></tr><tr><td>Any other doc</td><td>that doc</td></tr></table>` },
  { id: 'ui.md', dir: 'docs/testing', x: 700, y: 140, title: 'Manual UI testing',
    body: `<p>Open the app, walk the flow, screenshot each state.</p>` },
  { id: 'be-internal.md', dir: 'docs/testing', x: 700, y: 260, title: 'Backend tests',
    body: `<p>Run <code>pnpm test</code>. Add a case for every branch you touched.</p>` },
  { id: 'fe-internal.md', dir: 'docs/testing', x: 700, y: 380, title: 'Playwright smoke',
    body: `<p>One happy-path spec per screen. No fixtures beyond the seed.</p>` },
];
const EDGES = [
  ['CLAUDE.md','plan.md',2], ['CLAUDE.md','prototype.md',1],
  ['plan.md','plan-mode.md',3], ['plan.md','prototype.md',1], ['plan.md','ui.md',1], ['plan.md','be-internal.md',1], ['plan.md','fe-internal.md',1],
  ['prototype.md','PRODUCT.md',1], ['prototype.md','plan-mode.md',2], ['plan-mode.md','plan.md',1],
];
// Dangling references in the sample repo, as the scanner reports them.
let BROKEN = [
  { from: 'CLAUDE.md', line: 14, ref: 'docs/testing/e2e-legacy.md', text: 'See also `docs/testing/e2e-legacy.md` — old Cypress suite.', fixable: true, to: '' },
  { from: 'docs/plan.md', line: 9, ref: 'docs/design/tokens.md', text: 'When the design is unclear, skim `docs/design/tokens.md` before touching any component styles.', fixable: false, to: '' },
];
const NW = 150, NH = 44;
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const fullPath = n => n.dir === '/' ? n.id : `${n.dir}/${n.id}`;
// Stable hue per folder (src/layout.ts folderColor). Root files stay neutral.
function folderColor(path) {
  const folder = path.split('/').slice(0, -1).join('/');
  if (!folder) return 'var(--muted-foreground)';
  let h = 0; for (const c of folder) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `oklch(0.72 0.13 ${h % 360})`;
}
const nameOf = p => p.split('/').pop();
// LinkedDocs fan: inbound from above, outbound below, legend beneath.
function linkedDocs(id) {
  const W = 312, MID = 62, H = 118;
  const x = (i, n) => (W / (n + 1)) * (i + 1);
  const inb = EDGES.filter(e => e[1] === id).map(e => ({ path: fullPath(byId[e[0]]), id: e[0], count: e[2], color: folderColor(fullPath(byId[e[0]])) }));
  const outb = EDGES.filter(e => e[0] === id).map(e => ({ path: fullPath(byId[e[1]]), id: e[1], count: e[2], color: folderColor(fullPath(byId[e[1]])) }));
  if (!inb.length && !outb.length) return '';
  const legend = (list) => list.map(l => `<button data-go="${l.id}" title="${l.path}"><span class="dot" style="background:${l.color}"></span>${nameOf(l.path)}${l.count > 1 ? `<span class="x">×${l.count}</span>` : ''}</button>`).join('');
  return `<div class="linked">
    <svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
      ${inb.map((l, i) => `<g class="fan" style="--i:${i}">
        <path d="M${x(i, inb.length)} 14 C ${x(i, inb.length)} ${MID - 22}, ${W / 2} ${MID - 30}, ${W / 2} ${MID - 12}" fill="none" stroke="var(--accent-success)" stroke-opacity="0.45" stroke-width="1.25"/>
        <circle cx="${x(i, inb.length)}" cy="12" r="5" fill="${l.color}" data-go="${l.id}"><title>${l.path}</title></circle>
        ${l.count > 1 ? `<text x="${x(i, inb.length) + 8}" y="9" font-size="9" fill="var(--muted-foreground)">${l.count}</text>` : ''}
      </g>`).join('')}
      <rect x="${W / 2 - 60}" y="${MID - 12}" width="120" height="24" rx="5" fill="var(--background)" stroke="var(--accent-orange)" stroke-width="1"/>
      <text x="${W / 2}" y="${MID + 4}" text-anchor="middle" font-size="11" font-weight="500" fill="var(--foreground)">${id}</text>
      ${outb.map((l, i) => `<g class="fan" style="--i:${i}">
        <path d="M${W / 2} ${MID + 12} C ${W / 2} ${MID + 30}, ${x(i, outb.length)} ${MID + 22}, ${x(i, outb.length)} ${MID + 40}" fill="none" stroke="var(--accent-orange)" stroke-opacity="0.55" stroke-width="1.25" marker-end="url(#linked-arrow)"/>
        <circle cx="${x(i, outb.length)}" cy="${MID + 44}" r="5" fill="${l.color}" data-go="${l.id}"><title>${l.path}</title></circle>
      </g>`).join('')}
      <defs><marker id="linked-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="var(--accent-orange)" fill-opacity="0.7"/></marker></defs>
    </svg>
    <div class="legend">
      <div><div class="in">↓ pointed from <span class="n">${inb.length}</span></div>${legend(inb)}</div>
      <div><div class="out">↑ points to <span class="n">${outb.length}</span></div>${legend(outb)}</div>
    </div>
  </div>`;
}
const inout = id => [EDGES.filter(e => e[1] === id).length, EDGES.filter(e => e[0] === id).length];

function edgePath(a, b) {
  const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
  const back = x2 < x1;
  if (back) { // loop under
    const dip = Math.max(y1, y2) + 46;
    return { d: `M${x1 - NW/2},${y1 + NH/2} C${x1 - NW/2},${dip} ${x2 + NW/2},${dip} ${x2 + NW/2},${y2 + NH/2}`, lx: (x1 + x2) / 2, ly: dip - 4 };
  }
  const cx = (x1 + x2) / 2;
  return { d: `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`, lx: cx, ly: (y1 + y2) / 2 - 5 };
}

const v3 = () => `<div class="v3">
  <header>
    <span class="brand">signpost</span>
    <span class="meta"><span class="stat"><b>your-repo</b><span class="entry"> · CLAUDE.md</span> · 8 docs · 12 links</span><button class="badge" id="g-badge"></button></span>
    <nav><a href="#about">about</a><a href="${GH}">github</a><a class="btn" style="height:32px;font-size:12.5px" href="${GH}#install">install</a></nav>
  </header>
  <div class="canvasrow">
    <div class="canvas" id="g-canvas">
      <div class="plot"><svg viewBox="0 0 880 470" aria-hidden="true">
        <defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="context-stroke" stroke-width="1.25"/></marker></defs>
        ${EDGES.map(([f, t, n], i) => { const p = edgePath(byId[f], byId[t]); return `
          <path class="edge draw" data-from="${f}" data-to="${t}" d="${p.d}" marker-end="url(#arr)" style="animation-delay:${80 + i * 40}ms"/>
          ${n > 1 ? `<text class="elabel" x="${p.lx}" y="${p.ly}" text-anchor="middle">${n}</text>` : ''}`; }).join('')}
      </svg>
      ${NODES.map((n, i) => { const [ins, outs] = inout(n.id); return `
        <button class="node" data-id="${n.id}" style="left:${n.x / 880 * 100}%;top:${n.y / 470 * 100}%;animation-delay:${i * 30}ms">
          <span class="corner corner-tl"></span><span class="corner corner-tr"></span><span class="corner corner-bl"></span><span class="corner corner-br"></span>
          <span class="name">${n.id}${n.entry ? '<span class="tag">ENTRY</span>' : ''}</span>
          <span class="sub"><span>${n.dir}</span><span class="io"><span class="in">↓${ins}</span><span class="out">↑${outs}</span></span></span>
        </button>`; }).join('')}
      </div>
    </div>
    <aside class="panel" id="g-panel"></aside>
  </div>

  <div class="below" id="about">
    <h1>Your CLAUDE.md or AGENTS.md is a graph. <br>Signpost draws it.</h1>
    <p class="lede">Point it at your repo: it starts from <code>CLAUDE.md</code>, or <code>AGENTS.md</code> when that is what you have, then reads every markdown doc under <code>docs/</code> and every path they mention.</p>
    <div class="cmd" style="max-width:520px"><span><span class="p">$</span>${NPX}</span>${copyBtn(NPX)}</div>
    <div class="cols">
      <div><h3>reads</h3><p class="dim" style="margin:0;font-size:14px">Backticked paths like <code>docs/plan.md</code> and markdown links become arrows. A number on an edge is how many times the doc is mentioned.</p></div>
      <div><h3>fixes</h3><p class="dim" style="margin:0;font-size:14px">Broken pointers get their own list. Each one shows the reference as a diff, and one click points it at another doc or removes it.</p></div>
      <div><h3>writes</h3><p class="dim" style="margin:0;font-size:14px">New doc creates the file, adds a row to the entry table, a <code>See also</code> line in each parent, and a <code>Related:</code> line in the new doc.</p></div>
      <div><h3>scales</h3><p class="dim" style="margin:0;font-size:14px">Instant rank layout, folder tints, and a dense mode above 250 links so a few hundred docs load in a blink.</p></div>
      <div><h3>stays home</h3><p class="dim" style="margin:0;font-size:14px">Zero runtime dependencies, Node 20+, binds to <code>127.0.0.1</code>. Works in any repo that has markdown.</p></div>
    </div>
    ${footer}
  </div>
</div>`;

function wireV3() {
  const canvas = document.getElementById('g-canvas'); if (!canvas) return;
  const panel = document.getElementById('g-panel');
  const edges = [...canvas.querySelectorAll('.edge')];
  const nodes = [...canvas.querySelectorAll('.node')];
  const badge = document.getElementById('g-badge');
  const CTX = 14;
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const diff = b => {
    const i = b.text.indexOf(b.ref);
    let pre = b.text.slice(0, i), post = b.text.slice(i + b.ref.length);
    if (pre.length > CTX) pre = '…' + pre.slice(-CTX);
    if (post.length > CTX) post = post.slice(0, CTX) + '…';
    const strip = !b.to && pre.endsWith('`') && post.startsWith('`');
    const plus = !b.to && b.fixable ? '<span class="gone">line removed</span>'
      : `<span>${esc(strip ? pre.slice(0, -1) : pre)}${b.to ? `<mark class="add">${b.to}</mark>` : ''}${esc(strip ? post.slice(1) : post)}</span>`;
    return `<div><span class="m">−</span><span>${esc(pre)}<mark class="del">${b.ref}</mark>${esc(post)}</span></div><div><span class="pl">+</span>${plus}</div>`;
  };
  const renderBadge = () => { badge.innerHTML = `${BROKEN.length} broken<span class="w"> ${BROKEN.length === 1 ? 'link' : 'links'}</span>`; badge.hidden = !BROKEN.length; };
  const showBroken = () => {
    nodes.forEach(el => el.classList.remove('selected')); selectedId = null; light(null);
    if (!BROKEN.length) { panel.innerHTML = `<div class="empty"><b>no broken links</b>every reference points at a doc that exists.</div>`; return; }
    panel.innerHTML = `<div class="path"><span style="font-family:var(--font-display);font-size:24px;color:var(--foreground)">broken links</span></div>
      <p class="intro">References to docs that no longer exist. <b>replace</b> points the reference at another doc. <b>remove</b> drops a table row or "See also" line, and in prose strips just the reference.</p>
      ${BROKEN.map((b, i) => `<div class="bl">
        <div class="top"><b>${b.from}<span class="ln">:${b.line}</span></b><span class="kind">${b.fixable ? 'table / list' : 'prose'}</span></div>
        <div class="diff">${diff(b)}</div>
        <div class="act">
          <select data-i="${i}"><option value="" ${b.to ? '' : 'selected'} disabled>replace with…</option>${NODES.map(n => `<option value="${fullPath(n)}" ${b.to === fullPath(n) ? 'selected' : ''}>${fullPath(n)}</option>`).join('')}</select>
          <button class="b" data-fix="${i}" ${b.to ? '' : 'disabled'}>replace</button>
          <button class="b rm" data-fix="${i}">remove</button>
        </div>
      </div>`).join('')}`;
  };
  badge.addEventListener('click', () => { showBroken(); reveal(); });
  panel.addEventListener('change', e => {
    const sel = e.target.closest('select[data-i]'); if (!sel) return;
    BROKEN[+sel.dataset.i].to = sel.value; showBroken();
  });
  panel.addEventListener('click', e => {
    const b = e.target.closest('button[data-fix]'); if (!b) return;
    BROKEN.splice(+b.dataset.fix, 1); renderBadge(); showBroken();
  });
  renderBadge();
  let selectedId = null;
  const light = id => {
    if (!id) { canvas.removeAttribute('data-hover'); edges.forEach(e => e.classList.remove('lit')); return; }
    canvas.setAttribute('data-hover', '');
    edges.forEach(e => e.classList.toggle('lit', e.dataset.from === id || e.dataset.to === id));
  };
  const stacked = matchMedia('(max-width: 900px)');
  const reveal = () => { if (stacked.matches) panel.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); };
  const select = (id, byUser) => {
    const n = byId[id]; if (!n) return;
    selectedId = id; light(id);
    if (byUser) reveal();
    nodes.forEach(el => el.classList.toggle('selected', el.dataset.id === id));
    panel.innerHTML = `<div class="path"><span>${fullPath(n)}</span><span>${n.entry ? 'entry' : ''}</span></div>
      ${linkedDocs(id)}
      <h2>${n.title}</h2>${n.body}`;
  };
  nodes.forEach(el => {
    el.addEventListener('click', () => select(el.dataset.id, true));
    el.addEventListener('mouseenter', () => light(el.dataset.id));
    el.addEventListener('mouseleave', () => light(selectedId));
  });
  panel.addEventListener('click', e => {
    const c = e.target.closest('[data-go], code'); if (!c) return;
    const id = c.dataset.go || c.textContent.split('/').pop();
    if (byId[id]) select(id, true);
  });
  select('plan.md');
}

/* copy buttons */
document.addEventListener('click', async e => {
  const b = e.target.closest('.copy'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); } catch {}
  b.textContent = 'copied'; b.setAttribute('data-done', '');
  setTimeout(() => { b.textContent = 'copy'; b.removeAttribute('data-done'); }, 1200);
});

document.getElementById('app').innerHTML = v3();
wireV3();
</script>
</body>
</html>
